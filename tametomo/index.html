<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>為朝難風</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
  /* Layout: the triptych hung on a dark wall, a museum label beneath. A single
     night look on purpose: the print is lit, the room is not. The print itself
     is drawn in WebGL; this page adds the label, two controls and a hint. */
  :root {
    color-scheme: dark;
    --ground: #0b0c0f;      /* the wall; the canvas paints the same */
    --washi: #e8e2d4;       /* label text */
    --mist: #98a2ad;        /* secondary text */
    --shu: #c0482f;         /* vermilion seal */
    --ai: #7fa4cf;          /* the sea's indigo, for focus */
    --rule: rgba(152, 162, 173, 0.32);
    --mincho: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    --gothic: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    --ap-x: 0px; --ap-y: 0px; --ap-w: 100vw; --ap-h: 50vw;
  }
  html, body { height: 100%; }
  body { background: var(--ground); color: var(--washi); overflow: hidden; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }


  .controls {
    position: fixed; display: flex; gap: 6px; z-index: 3;
    top: max(8px, calc(var(--ap-y) - 38px), env(safe-area-inset-top, 0px));
    right: max(16px, calc(100vw - var(--ap-x) - var(--ap-w)), env(safe-area-inset-right, 0px));
  }
  .controls button {
    appearance: none; border: 1px solid var(--rule); background: color-mix(in srgb, var(--ground) 70%, transparent);
    color: var(--mist); font: 500 12px/1 var(--gothic); letter-spacing: 0.1em;
    width: 32px; height: 32px; padding: 0; border-radius: 16px; cursor: pointer; transition: color .2s, border-color .2s;
    display: grid; place-items: center;
  }
  .controls button svg { width: 16px; height: 16px; fill: currentColor; }
  .controls .i-play { display: none; }
  .controls button[aria-pressed="true"] .i-play { display: block; }
  .controls button[aria-pressed="true"] .i-pause { display: none; }
  .controls button:hover { color: var(--washi); border-color: var(--mist); }
  .controls button:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }

  .hint {
    position: fixed; left: 0; right: 0; margin: 0; text-align: center; pointer-events: none; z-index: 2;
    top: calc(var(--ap-y) + var(--ap-h) * 0.5 - 10px);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    font: 500 13px/1.5 var(--gothic); letter-spacing: 0.22em; color: var(--washi);
    text-shadow: 0 1px 14px rgba(0, 0, 0, 0.9), 0 0 3px rgba(0, 0, 0, 0.85);
    transition: opacity 1.4s ease; opacity: 0.85;
  }
  .hint.gone { opacity: 0; }

  .poster {
    position: fixed; left: var(--ap-x); top: var(--ap-y); width: var(--ap-w); height: var(--ap-h);
    max-width: none; object-fit: cover; z-index: 1; pointer-events: none; transition: opacity 1.2s ease;
  }
  .poster.gone { opacity: 0; }
  .loading {
    position: fixed; z-index: 2; left: var(--ap-x); width: var(--ap-w); top: calc(var(--ap-y) + var(--ap-h) + 3px);
    height: 1px; background: var(--rule);
  }
  .loading i { display: block; height: 100%; width: 0; background: var(--washi); transition: width .25s ease; }
  .loading.gone { opacity: 0; transition: opacity .8s; }

  @media (prefers-reduced-motion: reduce) { .hint, .loading i, .poster { transition: none; } }
</style>

<img class="poster" id="poster" src="assets/poster.webp" alt="">
<canvas id="stage" aria-label="歌川国芳《肥後国水俣の海上にて為朝難風に遭う》三联浮世绘的动态版：巨浪一层接一层隆起、前卷、落入波谷，满海的爪形水花不停翻滚，浪沫沿浪峰奔走，浪尖抛出飞沫；龙在黑云里翻腾，不时低头看海；船帆在风里起伏飘动；船被浪抛起又砸回，船上和水里的人一直在挣扎抖动；白缝姬一次次扑进海里，溅起水花；天狗猛力振翅，巨鱼甩尾前扑、张口咬合。"></canvas>
<div class="loading" id="loading"><i></i></div>
<p class="hint" id="hint" hidden>移动光标，换个站姿看</p>
<div class="controls">
  <button id="pause" type="button" aria-pressed="false" aria-label="暂停" title="暂停"><svg viewBox="0 0 24 24" aria-hidden="true"><g class="i-pause"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></g><path class="i-play" d="M8 5.5v13l11-6.5z"/></svg></button>
  <button id="full" type="button" aria-label="全屏" title="全屏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
  import { start } from './src/main.js';

  const $ = (id) => document.getElementById(id);
  const root = document.documentElement.style;
  const W = 3000, H = 1492;

  // Same layout as Window.layout() in src/scene.js, so the poster sits exactly
  // where the print will appear while it loads.
  const place = (ap) => {
    root.setProperty('--ap-x', ap.x + 'px'); root.setProperty('--ap-y', ap.y + 'px');
    root.setProperty('--ap-w', ap.w + 'px'); root.setProperty('--ap-h', ap.h + 'px');
  };
  const guess = () => {
    const vw = innerWidth, vh = innerHeight, aspect = W / H;
    const caption = 0, m = 0;
    let w = vw - 2 * m, h = w / aspect;
    if (h > vh - 2 * m - caption) { h = vh - 2 * m - caption; w = h * aspect; }
    return { x: (vw - w) / 2, y: Math.max(m, (vh - h - caption) / 2), w, h };
  };
  place(guess());
  addEventListener('resize', () => { if (!window.__arashi) place(guess()); });
  if (matchMedia('(pointer: coarse)').matches) $('hint').textContent = '拖动画面，换个站姿看';

  const gl2 = document.createElement('canvas').getContext('webgl2');
  if (!gl2) {
    $('loading').classList.add('gone');
    $('hint').textContent = '动态版需要 WebGL 2，这里显示的是静止版。请用最新版 Chrome、Safari 或 Firefox 打开。';
  } else {
    const ui = {
      progress: (p) => {
        $('loading').firstElementChild.style.width = `${Math.round(p * 100)}%`;
        if (p >= 1) {
          $('loading').classList.add('gone');
          requestAnimationFrame(() => requestAnimationFrame(() => $('poster').classList.add('gone')));
        }
      },
      layout: place,
      firstMove: () => setTimeout(() => $('hint').classList.add('gone'), 1400),
    };
    setTimeout(() => $('hint').classList.add('gone'), 9000);
    start($('stage'), ui).then((app) => {
      window.__arashi = app;
      $('pause').addEventListener('click', (e) => {
        app.state.paused = !app.state.paused;
        e.currentTarget.setAttribute('aria-label', app.state.paused ? '播放' : '暂停');
        e.currentTarget.title = app.state.paused ? '播放' : '暂停';
        e.currentTarget.setAttribute('aria-pressed', String(app.state.paused));
      });
      $('full').addEventListener('click', async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await document.documentElement.requestFullscreen();
        } catch { /* not available in this view */ }
      });
      const q = new URLSearchParams(location.search);
      if (q.has('tune')) import('./src/tune.js').then((m) => m.tune(app)).catch(() => {});
    }).catch((err) => {
      console.error(err);
      $('loading').classList.add('gone');
      document.body.insertAdjacentHTML('beforeend', `<p class="hint">动画没能加载（${String(err.message || err)}）。这里显示的是静止版。</p>`);
    });
  }
</script>

</body></html>
