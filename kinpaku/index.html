<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>金箔 相馬の古内裏</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+Antique:wght@400;500&display=swap">
<style>
  /* One world: black urushi around a window of gold leaf. The frame is drawn
     in WebGL; this page only adds the caption, the controls and the hint. */
  :root {
    color-scheme: dark;
    --lacquer: #090504;
    --lacquer-2: #140b08;
    --leaf: #d2a85a;
    --leaf-dim: #8c6a36;
    --paper: #eadcbf;
    --cinnabar: #b5352a;
    --mincho: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    --gothic: "Zen Kaku Gothic Antique", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    --ap-x: 0px; --ap-y: 0px; --ap-w: 100vw; --ap-h: 50vw;
  }
  html, body { height: 100%; }
  body { background: var(--lacquer); color: var(--paper); overflow: hidden; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: none; }

  .caption {
    position: fixed; left: 0; right: 0;
    top: calc(var(--ap-y) + var(--ap-h) + clamp(10px, 1.6vh, 18px));
    margin: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 0.35rem 1.1rem;
    pointer-events: none; text-align: center;
  }
  .caption h1 {
    margin: 0; font: 700 clamp(15px, 1.5vw, 21px)/1.2 var(--mincho);
    letter-spacing: 0.28em; color: var(--leaf); text-wrap: balance;
  }
  .caption p { margin: 0; font: 500 clamp(11px, 0.9vw, 13px)/1.5 var(--mincho); letter-spacing: 0.12em; color: var(--leaf-dim); }
  .caption .seal {
    display: inline-block; font: 700 10px/1 var(--mincho); color: var(--paper); background: var(--cinnabar);
    padding: 3px 3px 2px; border-radius: 2px; letter-spacing: 0; vertical-align: 1px; margin-right: 0.5em;
  }

  .controls {
    position: fixed; display: flex; gap: 6px;
    top: max(8px, calc(var(--ap-y) - 40px));
    right: max(16px, calc(100vw - var(--ap-x) - var(--ap-w)), env(safe-area-inset-right, 0px));
  }
  .controls button {
    appearance: none; border: 1px solid color-mix(in srgb, var(--leaf-dim) 55%, transparent); background: transparent;
    color: var(--leaf-dim); font: 500 12px/1 var(--gothic); letter-spacing: 0.08em;
    height: 28px; padding: 0 10px; border-radius: 14px; cursor: pointer;
    transition: color .2s, border-color .2s;
  }
  .controls button:hover { color: var(--leaf); border-color: var(--leaf); }
  .controls button:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }

  .hint {
    position: fixed; left: 0; right: 0; margin: 0; text-align: center; pointer-events: none;
    top: calc(var(--ap-y) + var(--ap-h) * 0.5 - 10px);
    font: 500 13px/1.4 var(--gothic); letter-spacing: 0.2em; color: var(--paper);
    text-shadow: 0 1px 12px rgba(0,0,0,.9), 0 0 3px rgba(0,0,0,.8);
    transition: opacity 1.2s ease; opacity: 0.85;
  }
  .hint.gone { opacity: 0; }

  .poster {
    position: fixed; left: var(--ap-x); top: var(--ap-y); width: var(--ap-w); height: var(--ap-h);
    max-width: none; object-fit: cover; z-index: 1; pointer-events: none;
    outline: 1px solid color-mix(in srgb, var(--leaf) 70%, transparent); outline-offset: 2px;
    transition: opacity 1s ease;
  }
  .poster.gone { opacity: 0; }
  .loading {
    position: fixed; z-index: 2; left: var(--ap-x); width: var(--ap-w); top: calc(var(--ap-y) + var(--ap-h) + 3px);
    height: 1px; background: color-mix(in srgb, var(--leaf-dim) 25%, transparent);
  }
  .loading i { display: block; height: 100%; width: 0; background: var(--leaf); transition: width .25s ease; }
  .loading.gone { opacity: 0; transition: opacity .8s; }

  @media (prefers-reduced-motion: reduce) { .hint, .loading i, .poster { transition: none; } }

  .controls button { width: 32px; height: 32px; padding: 0; border-radius: 16px; display: grid; place-items: center; }
  .controls button svg { width: 16px; height: 16px; fill: currentColor; }
  .controls .i-play { display: none; }
  .controls button[aria-pressed="true"] .i-play { display: block; }
  .controls button[aria-pressed="true"] .i-pause { display: none; }
</style>

<img class="poster" id="poster" src="assets/poster.webp" alt="">
<canvas id="stage" aria-label="歌川国芳《相馬の古内裏》的金箔动态版：巨大的金色骷髅从武士身后抬起手臂，两名武士拔刀相对，左侧的瀧夜叉姫随光标抬头。"></canvas>
<div class="loading" id="loading"><i></i></div>
<p class="hint" id="hint" hidden>移动光标，看进这间古内裏</p>
<div class="controls">
  <button id="pause" type="button" aria-pressed="false" aria-label="暂停" title="暂停"><svg viewBox="0 0 24 24" aria-hidden="true"><g class="i-pause"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></g><path class="i-play" d="M8 5.5v13l11-6.5z"/></svg></button>
  <button id="full" type="button" aria-label="全屏" title="全屏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
  import { start } from './src/main.js';

  const $ = (id) => document.getElementById(id);
  const root = document.documentElement.style;

  // Same window layout as Window.layout() in src/scene.js, so the poster sits
  // exactly where the gold leaf will appear while the scene loads.
  const place = (ap) => {
    root.setProperty('--ap-x', ap.x + 'px'); root.setProperty('--ap-y', ap.y + 'px');
    root.setProperty('--ap-w', ap.w + 'px'); root.setProperty('--ap-h', ap.h + 'px');
  };
  const guess = () => {
    const vw = innerWidth, vh = innerHeight, aspect = 3000 / 1499;
    const caption = 0, m = 0;
    let w = vw - 2 * m, h = w / aspect;
    if (h > vh - 2 * m - caption) { h = vh - 2 * m - caption; w = h * aspect; }
    return { x: (vw - w) / 2, y: Math.max(m, (vh - h - caption) / 2), w, h };
  };
  place(guess());
  addEventListener('resize', () => { if (!window.__soma) place(guess()); });
  const touch = matchMedia('(pointer: coarse)').matches;
  if (touch) $('hint').textContent = '拖动画面，看进这间古内裏';

  const gl2 = document.createElement('canvas').getContext('webgl2');
  if (!gl2) {
    $('loading').classList.add('gone');
    $('hint').textContent = '这件作品的动态版本需要 WebGL 2，上面是静止版本。请用最新版 Chrome、Safari 或 Firefox 打开。';
  } else {
    const ui = {
      progress: (p) => {
        $('loading').firstElementChild.style.width = `${Math.round(p * 100)}%`;
        if (p >= 1) {
          $('loading').classList.add('gone');
          requestAnimationFrame(() => requestAnimationFrame(() => $('poster').classList.add('gone')));
        }
      },
      layout: place,
      firstMove: () => setTimeout(() => $('hint').classList.add('gone'), 1200),
    };
    start($('stage'), ui).then((app) => {
      window.__soma = app;
      $('pause').addEventListener('click', (e) => {
        app.state.paused = !app.state.paused;
        e.currentTarget.setAttribute('aria-label', app.state.paused ? '播放' : '暂停');
        e.currentTarget.setAttribute('aria-pressed', String(app.state.paused));
      });
      $('full').addEventListener('click', async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await document.documentElement.requestFullscreen();
        } catch { /* not available in this view */ }
      });
      if (touch) {
        $('stage').addEventListener('click', () => app.input.enableTilt(), { once: true });
      }
      const q = new URLSearchParams(location.search);
      if (q.has('raw')) app.setRaw(true);
      if (q.has('tune')) import('./src/tune.js').then((m) => m.tune(app)).catch(() => {});
    }).catch((err) => {
      console.error(err);
      $('loading').classList.add('gone');
      document.body.insertAdjacentHTML('beforeend', `<p class="hint">动画没能加载（${String(err.message || err)}）。上面是静止版本。</p>`);
    });
  }
</script>

</body></html>
